apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.aspnetEnvironment | quote }}
  APP_NAME: {{ .Values.appName | quote }}
