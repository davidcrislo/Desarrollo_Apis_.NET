replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/davidcislo/accounts-api
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Datos no sensibles -> ConfigMap
appName: ApiCuentas.Api
aspnetEnvironment: Development

# Datos de conexión a la base -> Secret (se arma la connection string en el template)
postgres:
  host: postgres
  port: 5432
  database: apicuentas
  username: postgres
  password: postgres
  image: postgres:16
  storage: 1Gi

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

# Init container que espera a que Postgres esté listo antes de arrancar la API
waitForPostgres:
  enabled: true
  image: postgres:16

probes:
  path: /api/v1/cuentas
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 15

resources: {}
  # limits:
  #   cpu: 250m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
